<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="960" viewBox="0 0 960 960" fill="none" role="img" aria-labelledby="title"><title id="title">Interlocking translucent glass orbits</title><defs>
      <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".22" stop-color="#e5f0ff" stop-opacity=".5"/><stop offset=".48" stop-color="#e4f9f6" stop-opacity=".28"/><stop offset=".68" stop-color="#a9bce7" stop-opacity=".64"/><stop offset=".84" stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#c7c9fb" stop-opacity=".45"/></linearGradient>
      <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".38" stop-color="#fff" stop-opacity=".76"/><stop offset=".72" stop-color="#7a9cde" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity=".85"/></linearGradient>
      <linearGradient id="flow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#97aae8" stop-opacity=".75"/><stop offset=".47" stop-color="#f4fcff" stop-opacity=".88"/><stop offset="1" stop-color="#8bcfcb" stop-opacity=".8"/></linearGradient>
      <linearGradient id="depth" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#adc0e4" stop-opacity=".18"/><stop offset=".6" stop-color="#84a0d8" stop-opacity=".43"/><stop offset="1" stop-color="#d8e7fb" stop-opacity=".4"/></linearGradient>
      <radialGradient id="orb" cx=".3" cy=".23" r=".8"><stop stop-color="#fff" stop-opacity=".98"/><stop offset=".2" stop-color="#edf9ff" stop-opacity=".8"/><stop offset=".53" stop-color="#bdcffa" stop-opacity=".42"/><stop offset=".79" stop-color="#aac5e6" stop-opacity=".55"/><stop offset="1" stop-color="#f1f9ff" stop-opacity=".7"/></radialGradient>
      <radialGradient id="blue"><stop stop-color="#9eb6ff" stop-opacity=".72"/><stop offset="1" stop-color="#a8c0ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="mint"><stop stop-color="#9ee4d8" stop-opacity=".76"/><stop offset="1" stop-color="#c0eade" stop-opacity="0"/></radialGradient>
      <radialGradient id="purple"><stop stop-color="#c7b8f7" stop-opacity=".75"/><stop offset="1" stop-color="#ded5fa" stop-opacity="0"/></radialGradient>
      <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
      <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
      <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="12" result="blurred"/><feOffset in="blurred" dx="0" dy="12" result="offset"/><feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.47 0 0 0 0 0.65 0 0 0 0.16 0" result="drop"/><feMerge><feMergeNode in="drop"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
